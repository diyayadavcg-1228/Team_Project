<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .button{
            background-color: rgb(245, 96, 121);
            color: white;
            padding: 10px;
            margin: 10px;
            border: none;
            border-radius: 18px;
           
        }

        .button:hover{
            opacity: 0.7;
            background-color:white;
            color:rgb(245, 79, 107);
            border: 2px solid rgb(240, 102, 125);
            box-shadow: 1px 1px 1px rgba(0, 0, 0,0.8);
        }
    </style>
</head>
<body>
    <h1>login page</h1>
    <button class="button">LOGIN</button>
</body>
</html>
